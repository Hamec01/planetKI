<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поселение · обзор ассетов</title>
<style>
body{margin:0;background:#20292d;color:#f0e8d8;font:16px system-ui}header{position:sticky;top:0;background:#20292df5;padding:18px 24px;z-index:1;border-bottom:1px solid #506063}h1{font-size:23px;margin:0 0 12px}p{max-width:1000px;color:#c4cece}button,select{font:inherit;padding:8px 12px;background:#364749;border:1px solid #7b8b7c;color:inherit;border-radius:7px;margin-right:12px}main{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{background:#303d40;border:1px solid #566360;border-radius:12px;padding:12px}h2{font-size:17px;margin:10px 0 4px}small{color:#b5c6c2}canvas{width:100%;aspect-ratio:1;display:block;background-color:#3c494c;background-image:linear-gradient(45deg,#ffffff08 25%,transparent 25%),linear-gradient(-45deg,#ffffff08 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff08 75%),linear-gradient(-45deg,transparent 75%,#ffffff08 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}body.light canvas{background-color:#e2dfd6}#status{color:#e1bf6d}
</style>
<header><h1>Поселение · здания, улучшения и предметы</h1><button id="background">Светлый / тёмный фон</button><select id="state" aria-label="Строительное состояние"><option value="0">Основание</option><option value="1">Строительство</option><option value="2" selected>Готово</option><option value="3">Повреждено</option><option value="4">Руины</option></select><p>В редакторе: «Улучшения и предметы» добавляет 36 независимых объектов. «Здания поселения» добавляет 7 зданий. Здесь рисунки показаны крупно, без сравнения мирового масштаба. Интерьеры и орудия ещё требуют привязки к зданию или токену.</p><span id="status">Загрузка…</span></header><main id="gallery"></main>
<script type="module">
const [buildings,props]=await Promise.all(['manifest.json','upgrades.json'].map(async f=>{const r=await fetch(f);if(!r.ok)throw Error(f);return r.json()}));
const cache=new Map();
function load(file){if(!cache.has(file))cache.set(file,new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(file));im.src=file}));return cache.get(file)}
const cards=[];
function card(name,label,file,rect){const box=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;const title=document.createElement('h2');title.textContent=name;const detail=document.createElement('small');detail.textContent=label;box.append(canvas,title,detail);document.querySelector('#gallery').append(box);cards.push({canvas,file,rect})}
for(const b of buildings.buildings)card(b.name,'Здание · 5 строительных состояний',b.file,()=>b.frames[Number(document.querySelector('#state').value)]);
for(const p of props.items)card(p.name,p.buildingId+' · '+({interior:'интерьер',yard:'двор',prop:'предмет'}[p.placement]),p.atlas+'.png',()=>p.sourceRect);
async function draw(){await Promise.all(cards.map(async c=>{const im=await load(c.file),[x,y,w,h]=c.rect(),ctx=c.canvas.getContext('2d'),s=Math.min(456/w,456/h);ctx.clearRect(0,0,512,512);ctx.drawImage(im,x,y,w,h,(512-w*s)/2,484-h*s,w*s,h*s)}));document.querySelector('#status').textContent=buildings.buildings.length+' зданий · '+props.items.length+' улучшений и предметов'}
document.querySelector('#background').onclick=()=>document.body.classList.toggle('light');document.querySelector('#state').onchange=draw;draw().catch(e=>{document.querySelector('#status').textContent=e.message});
</script></html>
